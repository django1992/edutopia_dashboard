<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartera de Clientes — Meta Ads × Ventas</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="/lib/aggregate.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #F5F7F6; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#5B6E6B;">
    Cargando cartera...
  </div>
</div>
<script type="text/plain" id="app-source">

const { useState, useEffect, useMemo } = React;

// ---- Umbrales de semáforo, uno por métrica (ROAS, Agendamiento, Asistencia, Cierre) --
// editables desde la propia página, se guardan en localStorage y los define/migra/expone
// lib/aggregate.js (DEFAULT_THRESHOLDS, loadThresholds, saveThresholds, classifyThreshold)
// para que index.html use exactamente los mismos valores. ----
const CACHE_KEY = "cartera:lastPortfolio";
const VIEW_KEY = "cartera:view";
const REFRESH_MS = 5 * 60 * 1000;

const COLORS = { risk: "#B54A3F", warn: "#C9922E", healthy: "#0E7C7B", muted: "#8AA19E" };
const DARK_COLORS = { risk: "#D4685C", warn: "#DCA94A", healthy: "#4FBFAE", muted: "#6E8C88" };
const VIEWS = [
  { key: "tabla", label: "Tabla" },
  { key: "sala", label: "Sala de control" },
  { key: "tarjetas", label: "Tarjetas" },
];

// Metadatos del panel "⚙ Umbrales": un grupo de 2 campos (riesgo/atención) por métrica.
const THRESHOLD_METRICS = [
  { key: "roas", label: "Rentabilidad (ROAS)", unit: "×", step: "0.5" },
  { key: "scr", label: "Agendamiento", unit: "%", step: "1" },
  { key: "asisPct", label: "Asistencia", unit: "%", step: "1" },
  { key: "ccPct", label: "Cierre", unit: "%", step: "1" },
];

// Color de celda del mapa de calor (vista "Sala de control"): un cuarto escalón "alto" además
// de los 3 semáforo normales, para distinguir cuentas excelentes de simplemente sanas.
function heatColor(v, thresholds) {
  if (v === null || v === undefined) return { bg: "#152E2B", ink: "#5A716D" };
  const alto = thresholds.warn * 1.5;
  if (v < thresholds.risk) return { bg: "#B54A3F", ink: "#F2F7F5" };
  if (v < thresholds.warn) return { bg: "#C9922E", ink: "#0B1F1D" };
  if (v < alto) return { bg: "#2E7F72", ink: "#F2F7F5" };
  return { bg: "#4FBFAE", ink: "#0B1F1D" };
}

function useIsMobile(breakpoint) {
  const [isMobile, setIsMobile] = useState(
    () => typeof window !== "undefined" && window.innerWidth < breakpoint
  );
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < breakpoint);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [breakpoint]);
  return isMobile;
}

function loadCache(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveCache(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    /* localStorage puede fallar en modo privado -- no es crítico, seguimos igual */
  }
}

function Cartera() {
  const [portfolio, setPortfolio] = useState(() => loadCache(CACHE_KEY, { clients: [], syncedAt: null }));
  const [status, setStatus] = useState(() => (loadCache(CACHE_KEY, null) ? "cached-initial" : "loading"));
  const [errorMsg, setErrorMsg] = useState(null);
  const [thresholds, setThresholds] = useState(() => loadThresholds());
  const [showThresholds, setShowThresholds] = useState(false);
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState({ col: "roas", dir: "desc" });
  const [rangeTouched, setRangeTouched] = useState(false);
  const [range, setRange] = useState({ start: null, end: null });
  const [view, setView] = useState(() => loadCache(VIEW_KEY, "tabla"));
  const [cardFilter, setCardFilter] = useState("todos");
  const isMobile = useIsMobile(760);

  useEffect(() => { saveThresholds(thresholds); }, [thresholds]);
  useEffect(() => { saveCache(VIEW_KEY, view); }, [view]);

  const fetchLive = () => {
    setStatus((s) => (s === "cached-initial" ? s : "loading"));
    fetch("/api/portfolio?t=" + Date.now())
      .then((r) => r.json())
      .then((json) => {
        if (json.ok && json.clients && json.clients.length) {
          setPortfolio(json);
          setStatus("live");
          setErrorMsg(null);
          saveCache(CACHE_KEY, json);
        } else {
          setStatus("cached-error");
          setErrorMsg(json.error || "Respuesta inválida del servidor");
        }
      })
      .catch((err) => {
        setStatus("cached-error");
        setErrorMsg(String(err));
      });
  };

  useEffect(() => {
    fetchLive();
    const id = setInterval(() => {
      if (document.visibilityState === "visible") fetchLive();
    }, REFRESH_MS);
    return () => clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const clients = portfolio.clients || [];

  // Límites reales de fecha across todos los clientes (para el selector de rango).
  const bounds = useMemo(() => {
    let first = null, last = null;
    clients.forEach((c) => {
      (c.daily || []).forEach((r) => {
        if (!first || r.d < first) first = r.d;
        if (!last || r.d > last) last = r.d;
      });
    });
    return first && last ? { first, last } : null;
  }, [clients]);

  useEffect(() => {
    if (!rangeTouched && bounds) setRange({ start: bounds.first, end: bounds.last });
  }, [bounds, rangeTouched]);

  // Meses disponibles (unión entre todos los clientes) para las píldoras de rango y el mapa de calor.
  const ALL_MONTHS = useMemo(() => {
    const map = {};
    clients.forEach((c) => {
      (c.daily || []).forEach((r) => {
        const key = r.d.slice(0, 7);
        if (!map[key]) map[key] = { key, start: r.d, end: r.d };
        else {
          if (r.d < map[key].start) map[key].start = r.d;
          if (r.d > map[key].end) map[key].end = r.d;
        }
      });
    });
    return Object.keys(map).sort().map((k) => map[k]);
  }, [clients]);

  const isFullRange = bounds && range.start === bounds.first && range.end === bounds.last;

  const rangeLabel = useMemo(() => {
    if (isFullRange) return "acumulado";
    const m = ALL_MONTHS.find((m) => m.start === range.start && m.end === range.end);
    if (m) return MONTH_LABELS[m.key.slice(5, 7)] + " " + m.key.slice(0, 4);
    return "periodo personalizado";
  }, [isFullRange, ALL_MONTHS, range]);

  // ---- Una fila calculada por cliente: agregados del rango elegido, delta vs. mes anterior,
  // tendencia de los últimos 6 meses y semáforo -- todo desde aggregateExact (nunca promedios). ----
  const rows = useMemo(() => {
    return clients.map((c) => {
      const ok = c.ok !== false;
      const daily = c.daily || [];
      const agg = range.start && range.end ? aggregateExact(daily, range.start, range.end) : null;
      const months = monthsIn(daily);
      const lastM = months[months.length - 1] || null;
      const prevM = months.length > 1 ? months[months.length - 2] : null;
      const lastAgg = lastM ? aggregateExact(daily, lastM.start, lastM.end) : null;
      const prevAgg = prevM ? aggregateExact(daily, prevM.start, prevM.end) : null;
      const roas = ok && agg ? agg.roas : null;
      const deltaPct =
        lastAgg && prevAgg && lastAgg.roas != null && prevAgg.roas != null && prevAgg.roas !== 0
          ? (lastAgg.roas / prevAgg.roas - 1) * 100
          : null;
      const last6 = months.slice(-6);
      const series = last6.map((m) => aggregateExact(daily, m.start, m.end).roas);

      return {
        key: c.key, name: c.name, city: c.city, ok, daily,
        agg, lastAgg, prevAgg, roas, deltaPct, series,
        error: c.error || null,
        status: ok ? classifyThreshold(roas, thresholds.roas) : "muted",
      };
    });
  }, [clients, range, thresholds]);

  // Ranking fijo por ROAS (independiente del orden que el usuario elija en la tabla) --
  // lo usan la vista "Sala de control" y la de "Tarjetas".
  const rankedByRoas = useMemo(() => {
    return [...rows].sort((a, b) => {
      if (a.roas == null && b.roas == null) return 0;
      if (a.roas == null) return 1;
      if (b.roas == null) return -1;
      return b.roas - a.roas;
    });
  }, [rows]);

  // Últimos 6 meses reales del portafolio (unión entre clientes) -- columnas del mapa de calor.
  const HEAT_MONTHS = useMemo(() => ALL_MONTHS.slice(-6), [ALL_MONTHS]);

  // ---- Cola de alertas real (no hardcodeada) -- reglas propuestas en el README del handoff;
  // ajusta libremente los números si al verlas correr con datos reales no calzan. ----
  const alerts = useMemo(() => {
    const out = [];
    rows.forEach((r) => {
      if (!r.ok || !r.daily.length) return;

      if (
        r.lastAgg && r.prevAgg && r.lastAgg.roas != null && r.prevAgg.roas != null &&
        r.lastAgg.roas < thresholds.roas.risk && r.prevAgg.roas < thresholds.roas.risk
      ) {
        out.push({
          id: r.key + "-roas2", name: r.name, color: COLORS.risk,
          text: `ROAS ${r.lastAgg.roas.toFixed(1).replace(".", ",")}× · segundo mes seguido bajo ${thresholds.roas.risk}×`,
        });
      }

      if (r.agg && r.agg.asisPct != null && r.agg.asisPct < thresholds.asisPct.risk) {
        out.push({
          id: r.key + "-asis", name: r.name, color: COLORS.risk,
          text: `Asistencia ${r.agg.asisPct.toFixed(0)}% en el periodo activo (bajo ${thresholds.asisPct.risk}%)`,
        });
      }

      if (r.agg && r.agg.scr != null && r.agg.scr < thresholds.scr.risk) {
        out.push({
          id: r.key + "-scr", name: r.name, color: COLORS.risk,
          text: `Agendamiento ${r.agg.scr.toFixed(0)}% en el periodo activo (bajo ${thresholds.scr.risk}%)`,
        });
      }

      if (r.agg && r.agg.ccPct != null && r.agg.ccPct < thresholds.ccPct.risk) {
        out.push({
          id: r.key + "-cc", name: r.name, color: COLORS.risk,
          text: `Cierre ${r.agg.ccPct.toFixed(0)}% en el periodo activo (bajo ${thresholds.ccPct.risk}%)`,
        });
      }

      if (r.lastAgg && r.prevAgg && r.lastAgg.cac != null && r.prevAgg.cac != null && r.prevAgg.cac > 0) {
        const cacDelta = (r.lastAgg.cac / r.prevAgg.cac - 1) * 100;
        if (cacDelta > 30) {
          out.push({
            id: r.key + "-cac", name: r.name, color: COLORS.warn,
            text: `CAC subió ${cacDelta.toFixed(0)}% respecto al mes anterior`,
          });
        }
      }

      const last3 = r.daily.slice(-3);
      if (last3.length === 3) {
        const inv3 = last3.reduce((a, d) => a + d.inv, 0);
        const cie3 = last3.reduce((a, d) => a + d.cie, 0);
        if (inv3 > 0 && cie3 === 0) {
          out.push({
            id: r.key + "-nocierres", name: r.name, color: COLORS.warn,
            text: "Sin cierres en los últimos 3 días con inversión activa",
          });
        }
      }

      const lastDate = r.daily[r.daily.length - 1].d;
      const daysSince = Math.floor((Date.now() - new Date(lastDate + "T00:00:00").getTime()) / 86400000);
      if (daysSince > 2) {
        out.push({
          id: r.key + "-sync", name: r.name, color: COLORS.warn,
          text: `Sin datos nuevos hace ${daysSince} días (sincronización, no rendimiento)`,
        });
      }
    });
    return out;
  }, [rows, thresholds]);

  // ---- Feed de actividad reciente para "Sala de control" -- eventos reales tomados de las
  // últimas filas diarias de cada cliente (agendas, cierres, recolección), nunca inventados. ----
  const feed = useMemo(() => {
    const events = [];
    clients.forEach((c) => {
      if (c.ok === false) return;
      (c.daily || []).slice(-14).forEach((d) => {
        if (d.ag > 0) {
          events.push({ date: d.d, text: `${c.name} — ${d.ag} agenda${d.ag > 1 ? "s" : ""} nueva${d.ag > 1 ? "s" : ""}` });
        }
        if (d.cie > 0) {
          events.push({ date: d.d, text: `${c.name} — ${d.cie} cierre${d.cie > 1 ? "s" : ""}${d.fac ? " · " + clp(d.fac) : ""}` });
        } else if (d.fac > 0) {
          events.push({ date: d.d, text: `${c.name} — recolección ${clp(d.fac)}` });
        }
      });
    });
    events.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    return events.slice(0, 8).map((e) => ({ t: e.date.slice(8, 10) + "/" + e.date.slice(5, 7), text: e.text }));
  }, [clients]);

  const filteredSorted = useMemo(() => {
    let list = rows;
    const q = normText(query);
    if (q) list = list.filter((r) => normText(r.name).includes(q) || normText(r.city || "").includes(q));

    const dir = sortBy.dir === "asc" ? 1 : -1;
    const val = (r) => {
      switch (sortBy.col) {
        case "name": return normText(r.name);
        case "inv": return r.agg ? r.agg.inversion : -1;
        case "fac": return r.agg ? r.agg.recoleccion : -1;
        case "cmi": return r.agg ? r.agg.cmi : -1;
        case "ag": return r.agg ? r.agg.agendas : -1;
        case "scr": return r.agg && r.agg.scr != null ? r.agg.scr : -1;
        case "asi": return r.agg ? r.agg.asistencias : -1;
        case "asisPct": return r.agg && r.agg.asisPct != null ? r.agg.asisPct : -1;
        case "cie": return r.agg ? r.agg.cierres : -1;
        case "cc": return r.agg && r.agg.ccPct != null ? r.agg.ccPct : -1;
        case "cac": return r.agg && r.agg.cac != null ? r.agg.cac : -1;
        default: return r.roas != null ? r.roas : -1;
      }
    };
    return [...list].sort((a, b) => {
      const va = val(a), vb = val(b);
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
  }, [rows, query, sortBy]);

  const totals = useMemo(() => {
    const okRows = rows.filter((r) => r.ok && r.agg);
    const sum = (fn) => okRows.reduce((a, r) => a + fn(r.agg), 0);
    const inv = sum((a) => a.inversion);
    const fac = sum((a) => a.recoleccion);
    const ven = sum((a) => a.ventas);
    const cie = sum((a) => a.cierres);
    const ag = sum((a) => a.agendas);
    const asi = sum((a) => a.asistencias);
    const cmi = sum((a) => a.cmi);
    const citas = sum((a) => a.citas);
    // Para el % de asistencia del total usamos las bases ya acotadas a "hasta ayer" que
    // devuelve aggregateExact -- sumar `citas`/`asistencias` completos volvería a contar
    // citas agendadas a futuro que todavía no pudieron confirmarse como asistencia.
    const citasPasadas = sum((a) => a.citasPasadas);
    const asistenciasPasadas = sum((a) => a.asistenciasPasadas);
    return {
      inv, fac, ven, cie, ag, asi, cmi, citas,
      roas: inv ? fac / inv : null,
      cac: cie ? inv / cie : null,
      cc: asi ? (cie / asi) * 100 : null,
      // % de agendamiento = agendas sobre CMI (conversaciones), igual que agg.scr por cliente.
      scr: cmi ? (ag / cmi) * 100 : null,
      // % de asistencias = asistencias sobre citas ya transcurridas, igual que agg.asisPct.
      asisPct: citasPasadas ? (asistenciasPasadas / citasPasadas) * 100 : null,
    };
  }, [rows]);

  const nRiesgo = rows.filter((r) => r.status === "risk").length;
  const nAtencion = rows.filter((r) => r.status === "warn").length;
  const nSanos = rows.filter((r) => r.status === "healthy").length;

  const toggleSort = (col) => {
    setSortBy((s) => (s.col === col ? { col, dir: s.dir === "asc" ? "desc" : "asc" } : { col, dir: "desc" }));
  };

  const sortArrow = (col) => (sortBy.col === col ? (sortBy.dir === "asc" ? " ▲" : " ▼") : "");

  const linkFor = (key) => {
    const p = new URLSearchParams({ client: key });
    if (range.start && range.end) { p.set("start", range.start); p.set("end", range.end); }
    return "/?" + p.toString();
  };

  const cellMoney = (row, val) => (row.ok ? k1(val) : "—");
  const cellNum = (row, val) => (row.ok ? num2(val) : "—");

  const isDark = view === "sala";

  const ctx = {
    portfolio, status, errorMsg, fetchLive,
    thresholds, setThresholds, showThresholds, setShowThresholds,
    query, setQuery, sortBy, setSortBy, toggleSort, sortArrow,
    bounds, ALL_MONTHS, HEAT_MONTHS, range, setRange, rangeTouched, setRangeTouched, isFullRange, rangeLabel,
    rows, filteredSorted, rankedByRoas, totals, alerts, feed,
    nRiesgo, nAtencion, nSanos,
    view, setView, cardFilter, setCardFilter,
    isMobile, linkFor, cellMoney, cellNum, isDark,
  };

  return (
    <div style={{ ...styles.page, background: isDark ? "#0B1F1D" : "#F5F7F6" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        .odv-card { transition: transform .18s ease, box-shadow .18s ease; }
        .odv-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(11,31,29,0.10); }
        .odv-row:hover { background: #F5F7F6; cursor: pointer; }
        .odv-pill { transition: background .15s ease, color .15s ease; }
        .odv-fade { animation: odvFade .5s ease both; }
        @keyframes odvFade { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none; } }
        .odv-th { cursor: pointer; user-select: none; }
        .odv-th:hover { color: #0E7C7B; }
        .odv-refresh { transition: opacity .15s ease; cursor: pointer; }
        .odv-refresh:hover { opacity: 0.7; }
        @keyframes odvSpin { to { transform: rotate(360deg); } }
        .odv-spin { display: inline-block; animation: odvSpin 1s linear infinite; }
        .odv-dark-row:hover { background: #152E2B; cursor: pointer; }
        input[type="date"] { color-scheme: light; }
      `}</style>

      <TopBar ctx={ctx} />

      {showThresholds && (
        <div style={isDark ? styles.thresholdsPanelDark : styles.thresholdsPanel} className="odv-fade">
          <span style={isDark ? styles.thresholdsLabelDark : styles.thresholdsLabel}>Umbrales de semáforo por métrica (se guardan en este navegador y los usa también el panel individual de cada cliente):</span>
          <div style={styles.thresholdsGrid}>
            {THRESHOLD_METRICS.map((m) => (
              <div key={m.key} style={styles.thresholdsGroup}>
                <div style={isDark ? { ...styles.thresholdsGroupTitle, color: "#C9D8D5" } : styles.thresholdsGroupTitle}>{m.label}</div>
                <label style={styles.thresholdsField}>
                  Riesgo bajo
                  <input
                    type="number" step={m.step} min="0" value={thresholds[m.key].risk}
                    style={styles.thresholdsInput}
                    onChange={(e) => setThresholds((t) => ({ ...t, [m.key]: { ...t[m.key], risk: Number(e.target.value) } }))}
                  /> {m.unit}
                </label>
                <label style={styles.thresholdsField}>
                  Atención bajo
                  <input
                    type="number" step={m.step} min="0" value={thresholds[m.key].warn}
                    style={styles.thresholdsInput}
                    onChange={(e) => setThresholds((t) => ({ ...t, [m.key]: { ...t[m.key], warn: Number(e.target.value) } }))}
                  /> {m.unit}
                </label>
              </div>
            ))}
          </div>
        </div>
      )}

      {view === "tabla" && <VistaTabla ctx={ctx} />}
      {view === "sala" && <VistaSala ctx={ctx} />}
      {view === "tarjetas" && <VistaTarjetas ctx={ctx} />}
    </div>
  );
}

function TopBar({ ctx }) {
  const { rows, status, portfolio, fetchLive, showThresholds, setShowThresholds, bounds, ALL_MONTHS,
    range, setRange, rangeTouched, setRangeTouched, isFullRange, view, setView, isDark } = ctx;

  const titleFor = { tabla: "Todos los clientes", sala: "Sala de control", tarjetas: "Estado de la cartera" }[view];
  const s = isDark ? darkTop : styles;

  return (
    <header style={s.header} className="odv-fade">
      <div>
        <div style={s.eyebrow}>CARTERA · META ADS × VENTAS</div>
        <h1 style={s.h1}>{titleFor}</h1>
        <div style={s.subtitle}>
          {rows.length} cuenta{rows.length === 1 ? "" : "s"} · {ctx.rangeLabel} · cifras exactas por día
        </div>
      </div>

      <div style={styles.controlsCol}>
        <div style={styles.statusRow}>
          {status === "loading" && (
            <span style={s.statusBadge}><span className="odv-spin">↻</span> Conectando con Sheets…</span>
          )}
          {status === "live" && (
            <span style={{ ...s.statusBadge, color: isDark ? "#4FBFAE" : "#0E7C7B" }}>● En vivo · sync {timeAgo(portfolio.syncedAt)}</span>
          )}
          {status === "cached-error" && (
            <span style={{ ...s.statusBadge, color: "#D4685C" }}>● Datos guardados (sin conexión en vivo)</span>
          )}
          {status === "cached-initial" && (
            <span style={{ ...s.statusBadge, color: "#8AA19E" }}>● Datos guardados</span>
          )}
          <span className="odv-refresh" style={s.refreshBtn} onClick={fetchLive} title="Actualizar ahora">
            ↻ Actualizar
          </span>
          <span
            className="odv-refresh"
            style={{ ...s.refreshBtn, color: isDark ? "#9FB7B3" : "#5B6E6B" }}
            onClick={() => setShowThresholds((v) => !v)}
          >
            ⚙ Umbrales
          </span>
        </div>

        <div style={styles.pillRow}>
          {VIEWS.map((v) => (
            <button
              key={v.key}
              className="odv-pill"
              style={view === v.key ? styles.pillActive : styles.pill}
              onClick={() => setView(v.key)}
            >
              {v.label}
            </button>
          ))}
        </div>

        {bounds && (
          <div style={styles.pillRow}>
            <button
              className="odv-pill"
              style={isFullRange ? styles.pillActive : styles.pill}
              onClick={() => { setRangeTouched(false); setRange({ start: bounds.first, end: bounds.last }); }}
            >
              Acumulado
            </button>
            {ALL_MONTHS.map((m) => (
              <button
                key={m.key}
                className="odv-pill"
                style={range.start === m.start && range.end === m.end ? styles.pillActive : styles.pill}
                onClick={() => { setRangeTouched(true); setRange({ start: m.start, end: m.end }); }}
              >
                {MONTH_LABELS[m.key.slice(5, 7)]}
              </button>
            ))}
          </div>
        )}
      </div>
    </header>
  );
}

function KpiCard({ label, value, sub, accent }) {
  const accentColor = { teal: "#0E7C7B", mint: "#3FA796", coral: "#B54A3F", amber: "#C9922E", muted: "#8AA19E" }[accent] || "#0E7C7B";
  return (
    <div className="odv-card" style={styles.kpiCard}>
      <div style={{ ...styles.kpiBar, background: accentColor }} />
      <div style={styles.kpiLabel}>{label}</div>
      <div style={styles.kpiValue}>{value}</div>
      {sub && <div style={{ ...styles.kpiSub, color: accentColor }}>{sub}</div>}
    </div>
  );
}

function AlertsStrip({ alerts }) {
  if (!alerts.length) return null;
  return (
    <div style={styles.alertsStrip} className="odv-fade">
      <span style={styles.alertsLabel}>REQUIERE ACCIÓN HOY</span>
      {alerts.map((a) => (
        <div key={a.id} style={styles.alertItem}>
          <span style={{ fontWeight: 600, color: "#0B1F1D" }}>{a.name}</span>
          <span style={{ color: "#5B4A16" }}>{a.text}</span>
        </div>
      ))}
    </div>
  );
}

function VistaTarjetas({ ctx }) {

    { key: "risk", label: `En riesgo · ${nRiesgo}`, color: "#B54A3F" },

  const list = cardFilter === "todos" ? rankedByRoas : rankedByRoas.filter((r) => r.status === cardFilter);

  // Máximos del conjunto visible para normalizar las barras de CMI y Agendas (son conteos,

  const maxCmi = Math.max(1, ...list.map((r) => (r.ok && r.agg && r.agg.cmi != null ? r.agg.cmi : 0)));

          const asisColor = asisPct != null ? COLORS[classifyThreshold(asisPct, thresholds.asisPct)] : "#0E7C7B";
          const ccColor = ccPct != null ? COLORS[classifyThreshold(ccPct, thresholds.ccPct)] : "#3FA796";

                  </div>
                  <div style={{ fontSize: 11, color: "#8AA19E", marginTop: 3 }}>

              </div>
              <div style={styles.tBarCaption}><span>Cierre</span><span>{ccPct != null ? ccPct.toFixed(0) + "%" : "—"}</span></div>

// Métricas disponibles en el ranking de la Sala de control -- "get" saca el valor del row
// (el mismo `row` que arma la tabla/tarjetas, con .agg ya calculado para el rango elegido).
const RANKING_METRICS = [
  { key: "roas", label: "ROAS", fmt: (v) => (v != null ? v.toFixed(1).replace(".", ",") + "×" : "—"), get: (r) => r.roas },
  { key: "scr", label: "Agendamiento", fmt: (v) => (v != null ? v.toFixed(0) + "%" : "—"), get: (r) => (r.ok && r.agg ? r.agg.scr : null) },
  { key: "asisPct", label: "Asistencias", fmt: (v) => (v != null ? v.toFixed(0) + "%" : "—"), get: (r) => (r.ok && r.agg ? r.agg.asisPct : null) },
  { key: "ccPct", label: "Cierre", fmt: (v) => (v != null ? v.toFixed(0) + "%" : "—"), get: (r) => (r.ok && r.agg ? r.agg.ccPct : null) },
];

// ======================= VISTA 1c — Sala de control (mapa de calor) =======================
function VistaSala({ ctx }) {
  const { rows, rankedByRoas, HEAT_MONTHS, totals, alerts, feed, thresholds, isMobile, linkFor } = ctx;
  const [rankKey, setRankKey] = useState("roas");
  const maxRoas = Math.max(1, ...rankedByRoas.filter((r) => r.roas != null).map((r) => r.roas));

  const heatRows = rankedByRoas.filter((r) => r.ok);

  const metric = RANKING_METRICS.find((m) => m.key === rankKey) || RANKING_METRICS[0];
  // Ranking ordenado por la métrica elegida (siempre entre cuentas con datos) -- las cuentas
  // sin valor para esa métrica (p.ej. sin citas aún) van al final, nunca ocultas.
  const rankedByMetric = useMemo(() => {
    return rows.filter((r) => r.ok).slice().sort((a, b) => {
      const va = metric.get(a), vb = metric.get(b);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      return vb - va;
    });
  }, [rows, rankKey]);

  const Ranking = (
    <div style={styles.salaCol}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
        <div style={{ ...styles.salaLabel, marginBottom: 0 }}>RANKING POR {metric.label.toUpperCase()}</div>
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
        {RANKING_METRICS.map((m) => (
          <button
            key={m.key}
            className="odv-pill"
            style={rankKey === m.key ? styles.salaPillActive : styles.salaPill}
            onClick={() => setRankKey(m.key)}
          >
            {m.label}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 11 }}>
        {rankedByMetric.map((r) => {
          const v = metric.get(r);
          // El color refleja el semáforo de la métrica actualmente seleccionada en el ranking
          // (cada una con su propio umbral configurable), no siempre el de ROAS.
          const status = classifyThreshold(v, thresholds[metric.key]);
          const width = metric.key === "roas" ? (v != null ? (v / maxRoas) * 100 : 0) : Math.min(100, v || 0);
          return (
            <div key={r.key} className="odv-dark-row" style={{ padding: "2px 4px", borderRadius: 6 }} onClick={() => { window.location.href = linkFor(r.key); }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
                <span style={styles.salaClientName}>{r.name}</span>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 600, color: DARK_COLORS[status] }}>
                  {metric.fmt(v)}
                </span>
              </div>
              <div style={styles.salaRankTrack}>
                <div style={{ height: 4, borderRadius: 2, background: DARK_COLORS[status], width: width + "%" }} />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  const Heatmap = (
    <div style={{ ...styles.salaCol, minWidth: isMobile ? 520 : undefined }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
        <div style={styles.salaLabel}>ROAS POR MES{HEAT_MONTHS.length ? " · " + MONTH_LABELS[HEAT_MONTHS[0].key.slice(5, 7)] + " → " + MONTH_LABELS[HEAT_MONTHS[HEAT_MONTHS.length - 1].key.slice(5, 7)] : ""}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 7, fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: "#6E8C88" }}>
          <span>bajo</span>
          <span style={{ width: 14, height: 10, background: "#B54A3F", borderRadius: 2 }} />
          <span style={{ width: 14, height: 10, background: "#C9922E", borderRadius: 2 }} />
          <span style={{ width: 14, height: 10, background: "#2E7F72", borderRadius: 2 }} />
          <span style={{ width: 14, height: 10, background: "#4FBFAE", borderRadius: 2 }} />
          <span>alto</span>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: `132px repeat(${Math.max(1, HEAT_MONTHS.length)}, 1fr)`, gap: 4, alignItems: "center" }}>
        <div></div>
        {HEAT_MONTHS.map((m) => (
          <div key={m.key} style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, color: "#6E8C88", textAlign: "center" }}>
            {MONTH_LABELS[m.key.slice(5, 7)]}
          </div>
        ))}
        {heatRows.map((r) => (
          <React.Fragment key={r.key}>
            <div style={styles.salaClientName} onClick={() => { window.location.href = linkFor(r.key); }} className="odv-dark-row">{r.name}</div>
            {HEAT_MONTHS.map((m) => {
              const hasAny = r.daily.some((d) => d.d >= m.start && d.d <= m.end);
              const v = hasAny ? aggregateExact(r.daily, m.start, m.end).roas : null;
              const c = heatColor(v, thresholds.roas);
              return (
                <div key={m.key} style={{ height: 30, borderRadius: 3, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, fontWeight: 600, color: c.ink, background: c.bg }}>
                  {v != null ? v.toFixed(1).replace(".", ",") : "—"}
                </div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );

  const Sidebar = (
    <div style={styles.salaCol}>
      <div style={styles.salaLabel}>COLA DE ATENCIÓN</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {alerts.length === 0 && <div style={{ fontSize: 12, color: "#6E8C88" }}>Todo en orden por ahora.</div>}
        {alerts.slice(0, 6).map((a) => (
          <div key={a.id} style={{ ...styles.salaAlertCard, borderLeftColor: a.color }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, color: "#F2F7F5" }}>{a.name}</div>
            <div style={{ fontSize: 11.5, color: "#9FB7B3", marginTop: 3, lineHeight: 1.4 }}>{a.text}</div>
          </div>
        ))}
      </div>
      <div style={{ ...styles.salaLabel, margin: "22px 0 12px" }}>ÚLTIMAS AGENDAS</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
        {feed.length === 0 && <div style={{ fontSize: 12, color: "#6E8C88" }}>Sin actividad reciente.</div>}
        {feed.map((f, i) => (
          <div key={i} style={{ display: "flex", gap: 9, alignItems: "baseline" }}>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, color: "#4FBFAE", flex: "none" }}>{f.t}</span>
            <span style={{ fontSize: 11.5, color: "#9FB7B3", lineHeight: 1.4 }}>{f.text}</span>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div style={styles.salaCard} className="odv-fade">
      <div style={styles.salaTotalsRow}>
        <div><span style={styles.salaTotalLabel}>INV</span> <span style={styles.salaTotalValue}>{k1(totals.inv)}</span></div>
        <div><span style={styles.salaTotalLabel}>FACT</span> <span style={styles.salaTotalValue}>{k1(totals.fac)}</span></div>
        <div><span style={styles.salaTotalLabel}>CIERRES</span> <span style={styles.salaTotalValue}>{num2(totals.cie)}</span></div>
        <div><span style={styles.salaTotalLabel}>ROAS</span> <span style={{ ...styles.salaTotalValue, color: "#4FBFAE" }}>{totals.roas != null ? totals.roas.toFixed(1).replace(".", ",") + "×" : "—"}</span></div>
      </div>

      {!isMobile ? (
        <div style={styles.salaGrid3}>
          {Ranking}
          {Heatmap}
          {Sidebar}
        </div>
      ) : (
        <div style={styles.salaGridMobile}>
          {Ranking}
          <div style={{ overflowX: "auto" }}>{Heatmap}</div>
          {Sidebar}
        </div>
      )}

      <div style={styles.salaFooter}>● En vivo · sync {timeAgo(ctx.portfolio.syncedAt)} · cifras exactas por día, nunca prorrateadas</div>
    </div>
  );
}
